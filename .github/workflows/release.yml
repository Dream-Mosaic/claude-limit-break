name: Release

# Runs on every merge to main, but only publishes when package.json's version
# names a tag that does not exist yet. That is what makes it safe to fire on
# every push: a docs fix reaches the no-op path and says so, while a version
# bump cuts the release. The version is never derived or auto-incremented here
# - it is whatever a human put in package.json.
#
# There is deliberately no `concurrency` group. One would serialise runs, but
# GitHub keeps at most a single pending run per group and evicts the rest, so
# two quick merges could drop the middle run - and with it, a version that then
# never gets a .vsix and never gets retried, because its tag would still be
# missing while the newer tag exists. Concurrent runs are safe instead: the tag
# check makes different versions independent, and two runs racing on the SAME
# version end with one failing loudly on an already-published release rather
# than either of them silently skipping.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Is this version released yet?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are the record of what has already been released, so the
          # shallow default would make every version look new.
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Keyed on the tag rather than on the release, because a tag with no
          # release is how a version is deliberately reserved from publishing.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged. Nothing to release."
            # The one thing worth saying on the no-op path: main's source has
            # moved on from the last released tag while the version stayed put,
            # so those changes are sitting on main unreleased. This is the check
            # a pull-request-time version gate was only approximating - it asks
            # about the release, not about one pull request, so a single bump
            # answers it for every change since the tag.
            if [ -n "$(git diff --name-only "v$version" HEAD -- src/)" ]; then
              echo "::warning title=Unreleased source changes::src/ has changed since v$version was tagged, but package.json still says $version. Bump the version to release those changes."
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no tag yet. Releasing it."
          fi

  publish:
    # Deliberately not interpolating the version into the name: on a skipped
    # job the expression cannot resolve and GitHub renders it raw, which is
    # what most runs of this workflow are.
    name: Publish
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes. The check job above stays read-only.
      contents: write
    env:
      VSIX: claude-limit-buster-${{ needs.check.outputs.version }}.vsix
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before anything expensive, and before the tag exists. A version whose
      # changes were never written down is the way a changelog rots.
      - name: The version being released needs a changelog section
        run: |
          set -euo pipefail
          if ! grep -qE "^## \[?${VERSION//./\\.}\]?( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Move the Unreleased notes under it before releasing."
            exit 1
          fi
          echo "CHANGELOG.md documents $VERSION."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci

      # Re-run the suite here rather than trusting that CI passed on this
      # commit. A release that publishes untested code is the one failure this
      # workflow exists to prevent, and a minute of tests is cheap insurance.
      - run: npm test

      - name: Package
        run: npx --yes @vscode/vsce package --out "$VSIX"

      - name: Verify the package
        run: bash scripts/check-vsix.sh "$VSIX"

      # Draft first, then upload, then publish - never one shot.
      #
      # `gh release create` can fail AFTER the server has already created the
      # release and its tag, which would leave a tagged version with no .vsix
      # attached. The check job keys off tag existence, so that state is
      # permanent: every later run would see the tag, decide the version was
      # released, and never retry. A draft creates no tag until it is
      # published, so a failure anywhere below leaves nothing but a draft and
      # the next push starts over cleanly.
      - name: Draft the release
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "A draft for v$VERSION already exists - an earlier run failed part way. Reusing it."
            exit 0
          fi
          args=(--draft --title "v$VERSION" --generate-notes)
          # Everything below 1.0.0 goes out marked pre-release.
          case "$VERSION" in
            0.*) args+=(--prerelease) ;;
          esac
          gh release create "v$VERSION" "${args[@]}"

      - name: Attach the vsix
        run: gh release upload "v$VERSION" "$VSIX" --clobber

      - name: The asset must be attached before the release goes live
        run: |
          set -euo pipefail
          if ! gh release view "v$VERSION" --json assets -q '.assets[].name' | grep -qxF "$VSIX"; then
            echo "::error::$VSIX did not attach to the draft. Leaving it unpublished so the next run retries."
            exit 1
          fi
          echo "$VSIX is attached."

      - name: Publish
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --draft=false
          echo "Released v$VERSION with $VSIX attached."
