name: Version

# Its own workflow, not a job in ci.yml, because of `types` below.
#
# Shipping code changed without a version bump means the release workflow finds
# a tag that already exists and quietly publishes nothing - the change lands on
# main and never reaches a .vsix. This check makes that impossible to do by
# accident.
#
# The `no-release` label waives it: for a refactor split across several pull
# requests, or any src/ change deliberately not being released yet. A pull
# request touching no src/ files waives itself.
on:
  pull_request:
    # `labeled` and `unlabeled` are NOT in GitHub's default set (opened,
    # synchronize, reopened). Without them, adding the label to a failing pull
    # request would not re-run this check - the failure would sit there until
    # someone pushed a commit or re-ran the job by hand, which is an escape
    # hatch that does not open. Listing them here is the whole reason this is a
    # separate workflow: ci.yml's test matrix has no business re-running every
    # time someone edits a label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version:
    name: Version bump
    if: "!contains(github.event.pull_request.labels.*.name, 'no-release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares against the base branch, which the shallow
          # default does not fetch.
          fetch-depth: 0
      - name: A change to src/ needs a version bump
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -z "$(git diff --name-only "origin/$BASE...HEAD" -- src/)" ]; then
            echo "No src/ changes in this pull request; no version bump needed."
            exit 0
          fi
          git show "origin/$BASE:package.json" > base-package.json
          base=$(node -p "require('./base-package.json').version")
          head=$(node -p "require('./package.json').version")
          rm -f base-package.json
          if [ "$base" = "$head" ]; then
            echo "::error::src/ changed but the version is still $head. Bump it in package.json, or add the no-release label."
            exit 1
          fi
          echo "Version goes $base -> $head. Merging this will cut a release."
